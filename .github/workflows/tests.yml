name: Offline Unit Tests

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  offline-tests:
    name: Offline Tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ['3.12', '3.14']

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip packages
      uses: actions/cache@v6
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt', '**/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[api]"
        pip install pytest pytest-asyncio

    - name: Run offline tests
      run: |
        # Run only tests marked as 'offline' (no external dependencies)
        # Integration tests requiring databases/APIs are skipped by default
        pytest tests/ -m offline -v --tb=short

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: test-results-py${{ matrix.python-version }}
        path: |
          .pytest_cache/
          test-results.xml
        retention-days: 7

  webui-tests:
    name: Web UI (Vitest + Vite build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: lightrag_webui/package-lock.json

      - name: Install npm dependencies
        run: npm ci
        working-directory: lightrag_webui

      - name: Vitest
        run: npm test
        working-directory: lightrag_webui

      - name: Production build (no Bun)
        run: npm run build-no-bun
        working-directory: lightrag_webui
