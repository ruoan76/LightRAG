# LightRAG full-stack (API + WebUI) deployment.
# One-time: copy env.example to .env and set LLM/embedding config (see docs/DockerDeployment.md).
# Data dirs: default mounts match local dev (./rag_storage, ./inputs). Use ./data/... if you prefer.
#
# Ollama on the host (not in this compose file): .env often uses 127.0.0.1 for LLM/Embedding, which does NOT
# reach the host from inside the container. Use:
#   docker compose -f docker-compose.yml -f docker-compose.host-ollama.yml up -d --build
# Or set LLM_BINDING_HOST / EMBEDDING_BINDING_HOST to http://host.docker.internal:11434 in .env for Docker-only.

services:
  lightrag:
    container_name: lightrag
    image: ghcr.io/hkuds/lightrag:latest
    build:
      context: .
      dockerfile: Dockerfile
      tags:
        - ghcr.io/hkuds/lightrag:latest
    ports:
      - "${PORT:-9621}:9621"
    volumes:
      - ${RAG_STORAGE_MOUNT:-./rag_storage}:/app/data/rag_storage
      - ${INPUT_DIR_MOUNT:-./inputs}:/app/data/inputs
      - ./.env:/app/.env
    env_file:
      - .env
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Optional: mount config.ini for storage/backend overrides (create empty file if missing)
    # - ./config.ini:/app/config.ini
